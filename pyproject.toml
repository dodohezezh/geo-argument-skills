[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoarg"
version = "0.1.0"
description = "Deterministic contract engine for geological arguments."
readme = "README.en.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
geoarg = "geoarg.cli:main"

[tool.setuptools]
packages = ["geoarg"]
package-dir = { "" = "scripts" }
