[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoarg"
version = "1.10.0"
description = "Deterministic contract engine for geological arguments."
readme = "README.en.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6.0", "pypdf>=6.0", "python-docx>=1.1"]

[project.optional-dependencies]
schema = ["jsonschema>=4.20"]

[project.scripts]
geoarg = "geoarg.cli:main"

[tool.setuptools]
packages = ["geoarg"]
package-dir = { "" = "scripts" }

[tool.setuptools.package-data]
geoarg = ["_schema/*.json", "_patterns/*.yaml", "_skills/**/*"]
