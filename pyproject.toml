[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoarg"
version = "1.12.4"
description = "Deterministic contract engine for geological arguments."
readme = "README.en.md"
authors = [{ name = "GeoArg contributors" }]
keywords = ["geology", "argumentation", "research-software", "provenance", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6.0", "pypdf>=6.0", "python-docx>=1.1"]

[project.optional-dependencies]
schema = ["jsonschema>=4.20"]

[project.scripts]
geoarg = "geoarg.cli:main"

[tool.setuptools]
packages = ["geoarg"]
package-dir = { "" = "scripts" }

[tool.setuptools.package-data]
geoarg = ["_schema/*.json", "_patterns/*.yaml", "_skills/**/*"]
