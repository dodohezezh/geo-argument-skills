name: tectonics-slip-rate
title: Slip rate from an offset marker and its age
domain: plate-tectonics
description: >-
  Estimate a fault slip rate from a measured offset and the age of the offset
  marker. The argument depends on the offset and the age belonging to the same
  displacement episode.
argument: |
  # template: tectonics-slip-rate; replace every TODO
  schema_version: geoarg/0.6
  id: '{{id}}'
  title: '{{title}}'
  domain: plate-tectonics
  claim:
    id: C1
    statement: '{{claim}}'
    kind: reconstruction
    layer: L1
    scope: TODO - state the fault reach and the time window
  premises:
  - id: P1
    statement: TODO - the total offset of the marker across the fault is measured.
    kind: evidenced
    layer: L1
    status: undetermined
    evidence_refs: [ev.offset]
  - id: P2
    statement: TODO - the age of the displaced marker is known.
    kind: evidenced
    layer: L1
    status: undetermined
    evidence_refs: [ev.age]
  inference:
    rule_id: W.slip-rate
    warrant: Displacement accumulated over a known time interval gives an average slip rate.
    cp:
    - id: CP1
      statement: TODO - the offset marker is the same feature on both sides of the fault.
      cp_type: methodological
      state: unknown
      test_ref: T1
    - id: CP2
      statement: TODO - the marker records a single displacement episode with no later reworking.
      cp_type: temporal
      state: unknown
      test_ref: T2
    defeaters:
    - id: D1
      type: rebutting
      statement: TODO - part of the offset predates or postdates the dated marker.
      severity: fatal
      state: unknown
      test_ref: T1
  entailments:
  - id: E1
    statement: TODO - an independent geodetic rate agrees with the geological rate within uncertainty.
    kind: quantitative
    risk: high
    status: untested
    test_ref: T2
  dependencies:
    evidence_families: [tectonics, geochronology]
    shared_calibration: []
    depends_on: []
  gaps: []
  audit:
    author: TODO - author
    created: '{{today}}'
    updated: '{{today}}'
    version: 0.1-draft
