name: stratigraphy-sequence-boundary
title: Correlate a sequence boundary across a basin
domain: stratigraphy
description: >-
  Correlate one mapped surface between sections using a logged contact plus
  regional mapping. The load-bearing assumption is that the surface is a time
  surface rather than a facies boundary.
