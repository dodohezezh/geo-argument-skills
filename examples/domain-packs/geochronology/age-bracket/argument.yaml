# example: generated by `geoarg new --pattern geochronology-age-bracket`, then filled in
schema_version: geoarg/0.6
id: 'age-bracket'
title: 'Age bracket from two dated horizons'
domain: geochronology
claim:
  id: C1
  statement: 'The tephra layer at 42 cm is a single eruption at about 12.3 ka.'
  kind: eruption-age
  layer: L1
  scope: one lake core, 42 cm tephra, correlated across the basin by glass chemistry
premises:
- id: P1
  statement: A dated peat horizon 8 cm below the tephra is 12.9 +/- 0.2 ka.
  kind: evidenced
  layer: L1
  status: supported
  evidence_refs: [ev.upper]
- id: P2
  statement: A dated peat horizon 6 cm above the tephra is 11.8 +/- 0.2 ka.
  kind: evidenced
  layer: L1
  status: supported
  evidence_refs: [ev.lower]
inference:
  rule_id: W.age-bracket
  warrant: If one dated horizon predates the event and another postdates it, the event lies between them.
  cp:
  - id: CP1
    statement: The dated peat formed with its host horizon and was not reworked.
    cp_type: methodological
    state: unknown
    test_ref: T1
  defeaters:
  - id: D1
    type: rebutting
    statement: The tephra is a composite of reworked ash, so its age is not a single eruption age.
    severity: fatal
    state: unknown
    test_ref: T1
entailments:
- id: E1
  statement: A third, independent date inside the bracket reproduces the same eruption.
  kind: temporal-pattern
  risk: medium
  status: untested
  test_ref: T1
dependencies:
  evidence_families: [geochronology]
  shared_calibration: []
  depends_on: []
gaps: []
audit:
  author: geoarg domain-packs demo
  created: '2026-11-02'
  updated: '2026-11-02'
  version: '0.1'
