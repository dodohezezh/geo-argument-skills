    statement: The dated glass shards are reworked from an older tephra.
    severity: fatal
    state: unknown
    test_ref: T1
entailments:
- id: E1
  statement: No second tephra layer lies within the sampled interval.
  kind: temporal-pattern
  risk: medium
  status: untested
  test_ref: T1
